general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = /path/to/your/wallpaper.png   # Set your wallpaper path
    color = rgba(30, 30, 46, 1.0)        # Mocha Base
    blur_passes = 2                      # Match your smooth animations
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(203, 166, 247)    # Mauve
    inner_color = rgb(30, 30, 46)       # Base
    font_color = rgb(205, 214, 244)     # Text
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(205, 214, 244)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
