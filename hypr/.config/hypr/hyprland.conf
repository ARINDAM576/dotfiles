# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
# Open the visual Matuwall carousel menu layout via Super + W
bind = SUPER, W, exec, matuwall

bind = $mainMod, C, killactive,
bind = $mainMod ALT, O, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, G, togglefloating,
bind = $mainMod SHIFT, R, exec, $menu
bind = $mainMod, Z, pseudo, # dwindle
bind = $mainMod, D, layoutmsg, togglesplit # dwindle

# bind = $mainMod, R, exec, vicinae open -q "run"
bind = $mainMod, R, exec, vicinae deeplink "vicinae://launch/system/run"
bind = $mainMod, V, exec, vicinae deeplink "vicinae://launch/clipboard/history"
bind = $mainMod, RETURN, exec, vicinae deeplink "vicinae://launch/core/search-emojis"
bind = $mainMod, slash, exec, vicinae deeplink "vicinae://launch/files/search"
bind = $mainMod, slash-forward, exec, vicinae deeplink "vicinae://launch/@josephschmitt/store.raycast.gif-search/search

bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0 

bind = SUPER ALT, R, exec, swaync-client -R && swaync-client -rs && sleep 2 && killall cava && sleep 2 && killall waybar && sleep 2 && waybar


bind = , Print, exec, flameshot gui
bind = $mainMod, Print, exec, flameshot full
# Open clipboard history with wofi
bind = SUPER SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy


# Keybind to lock manually (SUPER + L)
bind = SUPER, L, exec, loginctl lock-session


# Browse notification history in Wofi
#bind = SUPER, N, exec, dunstctl history | jq -r '.data[] | "[\(.summary.data)] \(.body.data)"' | wofi --dmenu --prompt "Notification History" | xargs -I{} notify-send "History" "{}"


bind = $mainMod, N, exec, swaync-client -t -sw

bind = $mainMod, Space, exec, vicinae toggle

bind = WIN, F1, exec, ~/.config/hypr/gamemode.sh


bind = $mainMod, M, exec, pypr toggle spotify

# Hide active window (move to workspace 88 silently)
# bind = $mainMod, H, movetoworkspacesilent, 88
# bind = $mainMod SHIFT, H, workspace, 88
# Press Super + A to show or hide your audio workspace overlay
bind = $mainMod, H, togglespecialworkspace, hidden
bind = $mainMod, A, togglespecialworkspace, audio
bind = $mainMod SHIFT, H, movetoworkspacesilent, special:hidden
bind = $mainMod SHIFT, A, movetoworkspacesilent, special:audio
# Show all hidden windows (pull everything from workspace 88 to your current workspace)
# bind = $mainMod ALT, H, movetoworkspace, 1


# Toggle HyprWave visibility
# bind = SUPER_SHIFT, M, exec, hyprwave-toggle visibility
# Expand music details (even in visualizer mode)
# bind = SUPER, M, exec, hyprwave-toggle expand


bind = SUPER, tab, hyprexpo:expo, toggle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

