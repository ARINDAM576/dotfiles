#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox


#exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME
#exec-once = dunst
#exec-once = hyprpaper
#exec-once = waybar
#exec-once = polkit-kde-agent
#exec-once = hyprctl setcursor Adwaita 24

# 1. Essential Environment Setup (Always first)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME

# 2. Services that provide or rely on D-Bus names
exec-once = swaync
# exec-once = polkit-kde-agent
exec-once = /usr/lib/polkit-kde-authentication-agent-1


# 3. Visuals/UI
# exec-once = hyprpaper
# Execute the wallpaper rotation loop on boot
# exec-once = ~/.config/hypr/wallpaper-carousel.sh
# Start the backend engine and restore the last used Matuwall carousel image automatically
exec-once = ~/.config/hypr/nvidia.sh
exec-once = awww-daemon --format xrgb
exec-once = sleep 0.5 && awww restore


# exec-once =  ~/.config/hypr/auto_wallpaper.sh
# exec-once = hyprctl setcursor Adwaita 24
exec-once = hyprctl setcursor catppuccin-mocha-light-cursors 24

# 4. Waybar (Last, with a 1-second delay to prevent the Tray error)
exec-once = sleep 1 && waybar


# exec-once= pkill handle_sounds.sh; sleep 2 && ~/.config/hypr/handle_sounds.sh


# Watch for text and images and store them in cliphist
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-clip-persist --clipboard regular


exec-once = hypridle

exec-once = vicinae server

exec-once = [workspace special:audio silent; noinitialfocus] virtual-surround-manager
# exec-once = [workspace special:audio silent; noinitialfocus] jamesdsp
exec-once = [workspace special:audio silent; noinitialfocus] qpwgraph -m

# Autostart hyprsunset daemon
exec-once = hyprsunset

exec-once = pypr

# Battery notifications (Warning at 20%, Critical at 10%, Danger at 5%)
exec-once = batsignal -w 20 -c 15 -d 5

exec-once = kdeconnect-indicator &

exec-once = wluma

exec-once = hyprpm reload -n



# exec-once = hyprwave


