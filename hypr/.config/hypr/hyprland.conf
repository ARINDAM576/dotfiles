# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 10

    border_size = 1

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

cursor {
    no_hardware_cursors = false
}

misc {
    vrr = false
}



# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.8
    # dim_inactive = true
    # dim_strength = 0.3
    # dim_around = 0.4
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 6
        passes = 2
        ignore_opacity = true

        brightness = 0.58
        vibrancy = 0.6
        vibrancy_darkness = 0.3
        contrast = 1.1

        xray = true #Optimization
        new_optimizations = true

        popups = true
        popups_ignorealpha = 0.1
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # curves v2-
    # Define a cubic bezier curve: name, X0, Y0, X1, Y1
    bezier = easeOutCubic, 0.33, 1, 0.68, 1
    # Snappy curve with slight overshoot:
    bezier = overshot, 0.05, 0.9, 0.1, 1.05

    bezier = fluent_decel, 0.1, 1, 0, 1
    bezier = easeOutBack, 0.34, 1.3, 0.64, 1
    bezier = bounce, 0, 1.1, 0.1, 1.1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    # animation = border,        1,     5.39,  easeOutQuint
    # animation = windows,       1,     4.79,  easeOutQuint
    # animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    # animation = windowsOut,    1,     1.49,  linear,       popin 87%
    # animation = fadeIn,        1,     1.73,  almostLinear
    # animation = fadeOut,       1,     1.46,  almostLinear
    # animation = fade,          1,     3.03,  quick
    # animation = layers,        1,     3.81,  easeOutQuint
    # animation = layersIn,      1,     4,     easeOutQuint, fade
    # animation = layersOut,     1,     1.5,   linear,       fade
    # animation = fadeLayersIn,  1,     1.79,  almostLinear
    # animation = fadeLayersOut, 1,     1.39,  almostLinear
    #animation = workspaces,    1,     1.94,  almostLinear, fade
    #animation = workspacesIn,  1,     1.21,  almostLinear, fade
    #animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick


    #animations v2-
    # Syntax: animation = NAME, ENABLED (0/1), SPEED (100ms units), CURVE, STYLE
    # animation = workspaces, 1, 5, overshot, slide

    # Slide special workspaces / scratchpads vertically
    # animation = specialWorkspace, 1, 4, overshot, slidevert


    #curves and animations v3
    # Material 3 Spring Curves (Simulated Damped Harmonic Oscillator)
    # Y1 > 1.0 causes the bounce/overshoot past the destination
    bezier = md3_spring, 0.05, 0.9, 0.1, 1.08
    bezier = md3_decel, 0.05, 0.7, 0.1, 1.0
    bezier = md3_accel, 0.3, 0.0, 0.8, 0.15

    # Windows
    # Opens from 80% size and snaps past 100% before settling
    animation = windows, 1, 4.2, md3_spring, popin 80%
    animation = windowsIn, 1, 4.2, md3_spring, popin 80%
    # Closing windows must never bounce (avoids feeling laggy or unresponsive)
    animation = windowsOut, 1, 2.5, md3_accel, popin 90%
    # Moving or resizing tiles rubber-bands smoothly
    animation = windowsMove, 1, 4.5, md3_spring

    # Workspaces
    # Slides horizontally with a subtle rebound when reaching the target workspace
    animation = workspaces, 1, 4.5, md3_spring, slide
    animation = specialWorkspace, 1, 4, md3_spring, slidevert

    # Fading & Borders
    animation = fade, 1, 3, md3_decel
    animation = border, 1, 4, md3_decel

    # Layers (App launchers, notifications, waybar, etc.)
    bezier = easeOutQuart, 0.25, 1, 0.5, 1

    # Movement: slide from the right on enter, slide back to the right on exit
    animation = layersIn, 1, 4, md3_spring, slide top
    animation = layersOut, 1, 2.5, md3_accel, slide top

    # Opacity: fade in and fade out simultaneously
    animation = fadeLayersIn, 1, 3, easeOutQuart
    animation = fadeLayersOut, 1, 2, md3_accel




    # Spring animation curve (overshoots slightly, then settles)
bezier = spring, 0.34, 1.56, 0.64, 1

# Apply spring animation to layer surfaces
animation = layers, 1, 4, spring, slide top
}
