plugin {
    # hyprexpo (Workspace Grid) config
    hyprexpo {
        columns = 3
        gap_size = 48
        gaps_out = 0
        bg_col = rgba(111111ff)
        workspace_method = center current # [center/first] [workspace/monitor]

        enable_gestures = true
        gesture_fingers = 3  # Swipe up/down with 3 fingers to trigger grid
        gesture_distance = 300
        # gesture_positive = false
        gesture_direction = vertical

        label_enable = 1
        border_width = 2

        dynamic_grid  = 1
        wallpaper_bg = 1
        # label_pos = top_left
        label_size = 48

        tile_rounding = 10
        tile_rounding_power = 2
        tile_rounding_focus = 0
    }
}
