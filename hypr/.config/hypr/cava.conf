[input]
method = pipewire
source = auto

[general]
bars = 12
sleep_timer = 1


framerate = 60
autosens = 1
senstivity = 100
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
# # source = mono
# channels = mono
# mono_option = average
# # stereo = false
# # mono = true
# reverse = 0
# bar_delimiter = 0
# monstercat = false
# waves = false
# noise_reduction = 77


[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
channels = mono
mono_option = average
reverse = 0
bar_delimiter = 59

[smoothing]
monstercat = 0
waves = 0
noise_reduction = 65

